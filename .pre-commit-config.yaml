# Pre-commit hooks configuration for aisreact
# See https://pre-commit.com for more information

default_language_version:
  python: python3.11
  node: "22.0.0"

repos:
  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # Python specific
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        files: ^backend/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        files: ^backend/
        args: ["--profile", "black", "--line-length", "88"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^backend/
        args: ['--max-line-length=88', '--extend-ignore=E203,W503']
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  # Security checks for Python
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-r', 'backend/', '-ll', '-x', 'backend/tests/,backend/venv/']
        pass_filenames: false

  # Django specific
  - repo: local
    hooks:
      - id: django-migrations-check
        name: Check Django migrations
        entry: bash -c 'cd backend && python manage.py makemigrations --check --dry-run'
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/.*models\.py$

  # JavaScript/TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - eslint-config-next@14.0.4
          - '@typescript-eslint/parser@6.19.0'
          - '@typescript-eslint/eslint-plugin@6.19.0'
        args: ['--fix']
        exclude: ^(frontend/\.next/|frontend/node_modules/)

  # Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|css|scss|json|md)$
        exclude: ^(frontend/\.next/|frontend/node_modules/)

  # Security checks for JavaScript
  - repo: local
    hooks:
      - id: check-console-statements
        name: Check for console statements
        entry: bash -c 'grep -r "console\." frontend/app frontend/components --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=.next || true'
        language: system
        pass_filenames: false

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Commit message
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript type check
        entry: bash -c 'cd frontend && pnpm run type-check:prod'
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^backend/
        args: ['--ignore-missing-imports', '--check-untyped-defs', '--no-strict-optional']
        additional_dependencies:
          - django-stubs
          - djangorestframework-stubs
          - types-requests
          - types-redis

# Configuration for specific file types
files: |
  (?x)^(
    backend/.*\.py|
    frontend/.*\.(js|jsx|ts|tsx)|
    .*\.(json|yaml|yml|md)|
    \.env\.example
  )$

exclude: |
  (?x)^(
    .*\.min\.(js|css)|
    frontend/\.next/|
    frontend/node_modules/|
    backend/staticfiles/|
    backend/media/|
    backend/venv/|
    .*migrations/.*\.py|
    .*__pycache__/|
    \.git/|
    \.pytest_cache/|
    htmlcov/|
    \.coverage
  )$
