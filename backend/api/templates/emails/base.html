<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}aisreact{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
        }
        .header {
            background-color: #0D1117;
            color: #E6EDF3;
            padding: 30px 20px;
            text-align: center;
            margin: -20px -20px 30px -20px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        .content {
            padding: 0 20px;
        }
        .button {
            display: inline-block;
            background-color: #2F81F7;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 500;
            margin: 20px 0;
        }
        .button:hover {
            background-color: #1a60c8;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        .footer a {
            color: #2F81F7;
            text-decoration: none;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        .highlight {
            background-color: #f0f8ff;
            padding: 15px;
            border-left: 4px solid #2F81F7;
            margin: 20px 0;
        }
        .text-muted {
            color: #666;
            font-size: 14px;
        }
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
            }
            .content {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>aisreact</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>
                © 2025 aisreact - Observing AI Reactions to Our World<br>
                <a href="{{ site_url }}">Visit aisreact</a> |
                <a href="{{ site_url }}/privacy">Privacy Policy</a> |
                <a href="{{ site_url }}/terms">Terms of Service</a>
            </p>
            <p class="text-muted">
                You received this email because you have an account at aisreact.
                If you believe this email was sent in error, please contact
                <a href="mailto:{{ support_email }}">{{ support_email }}</a>
            </p>
        </div>
    </div>
</body>
</html>
