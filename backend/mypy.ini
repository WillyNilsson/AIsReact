[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_optional = True

# Ignore test files for now
[mypy-tests.*]
ignore_errors = True

[mypy-backend.test_*]
ignore_errors = True

# Ignore Django migrations
[mypy-*.migrations.*]
ignore_errors = True

# Be less strict with middleware
[mypy-api.middleware_modules.*]
check_untyped_defs = False

# Ignore specific problematic modules
[mypy-api.admin_actions]
ignore_errors = True

[mypy-api.utils.request_id]
ignore_errors = True

[mypy-aisreact.env_validator]
ignore_errors = True

[mypy-gunicorn.conf]
ignore_errors = True