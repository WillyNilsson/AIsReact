apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceName: Tempo
          matcherRegex: '"request_id":"([^"]+)"'
          name: RequestID
          url: '$${__value.raw}'
        - datasourceName: Prometheus
          matcherRegex: '"user_id":(\d+)'
          name: UserID
          url: '/explore?orgId=1&left=%5B%22now-1h%22,%22now%22,%22Prometheus%22,%7B%22expr%22:%22user_id%3D$${__value.raw}%22%7D%5D'
